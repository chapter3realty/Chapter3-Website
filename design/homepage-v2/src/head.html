</style>
<style id="c3-home-v2">
/* Homepage, 2026-09 redesign. Motion grammar: lines draw, strokes draw, frames scale.
   Type never hides. Every hidden state below is decoration, lives under .m (set by the
   head boot only when motion is allowed and IntersectionObserver exists) and is cleared
   by a 3s failsafe if the page script never runs. */
#page-home{--ease-out:cubic-bezier(.16,1,.3,1);--ease-io:cubic-bezier(.65,0,.35,1);--serif:'Fraunces','Fraunces Fallback','Fraunces Fallback N','Fraunces Fallback T',serif;--disp:'Fraunces','Fraunces Display Fallback','Fraunces Display Fallback N','Fraunces Display Fallback T',serif;--sans:'DM Sans','DM Sans Fallback','DM Sans Fallback N',system-ui,sans-serif;display:block;font-family:var(--sans)}
#page-home .band-navy{--bg:var(--navy);--fg:var(--ivory);--fg-2:rgba(244,239,232,.78);--acc:var(--brass-2);--acc-it:var(--ivory-3);--line:rgba(244,239,232,.14);--line-strong:rgba(244,239,232,.4);--ring:var(--ivory-3);background:var(--bg);color:var(--fg)}
#page-home .band-ivory,#page-home .band-ivory2{--bg:var(--ivory);--fg:var(--navy);--fg-2:rgba(28,32,40,.78);--acc:var(--brass-ink);--acc-it:var(--brass-ink);--line:rgba(28,32,40,.14);--line-strong:rgba(28,32,40,.4);--ring:var(--brass-ink);background:var(--bg);color:var(--fg)}
#page-home .band-ivory2{--bg:var(--ivory-2)}
#page-home .band{padding:clamp(72px,9vw,120px) 0;position:relative}
#page-home .band :where(p){font-size:17px;line-height:1.65;color:var(--fg-2);text-wrap:pretty}
#page-home .cine-sub,#page-home .stat-label,#page-home .rv-slide blockquote p{text-wrap:pretty}
#page-home .w{max-width:1200px;margin:0 auto;padding:0 2rem}
#page-home :focus-visible{outline:2px solid var(--ring,var(--ivory-3));outline-offset:3px}
/* keyboard focus never lands under the 89px sticky header (fx.html sets the measured value) */
html{scroll-padding-top:97px}

/* shared anatomy */
#page-home .eb{display:flex;align-items:center;font:500 11.5px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--acc)}
#page-home .eb::before{content:"";flex:0 0 28px;height:1px;margin-right:12px;background:currentColor;transform-origin:0 50%;transition:transform .52s var(--ease-out)}
#page-home .band h2{font-family:var(--serif);font-weight:300;font-variation-settings:'wght' 340;font-synthesis:none;font-size:clamp(34px,4.2vw,56px);line-height:1.04;letter-spacing:-.015em;text-wrap:balance;color:var(--fg);margin:16px 0 0}
#page-home .it{font-style:italic;font-variation-settings:'wght' 300;color:var(--acc-it)}
#page-home .tl{display:inline-flex;align-items:center;gap:.35em;min-height:44px;font:600 15.5px/1.3 var(--sans);color:var(--acc);text-decoration:none}
#page-home .tl-t{text-decoration-line:underline;text-decoration-thickness:1px;text-decoration-color:var(--line-strong);text-underline-offset:.3em;transition:text-decoration-color .25s}
#page-home .arr{display:inline-block;transition:transform .3s var(--ease-out)}
#page-home .tl:hover .tl-t,#page-home .tl:focus-visible .tl-t{text-decoration-color:var(--acc)}
#page-home .tl:hover .arr,#page-home .tl:focus-visible .arr,#page-home .btn:hover .arr,#page-home .btn:focus-visible .arr{transform:translateX(4px)}
#page-home .ln{display:block;transform-origin:0 50%;transition:transform .52s var(--ease-out) calc(var(--i,0)*90ms)}

/* brass buttons: a brass-2 fill sweeps in from the left; nothing else changes */
#page-home .btn-brass{position:relative;isolation:isolate;overflow:clip!important;border-radius:0;background:var(--brass);transition:box-shadow .3s!important}
#page-home .btn-brass::before{content:"";position:absolute;inset:0;background:var(--brass-2);transform:scaleX(0);transform-origin:0 50%;transition:transform .45s var(--ease-out);z-index:-1}
#page-home .btn-brass:hover{background:var(--brass)}
@media (hover:hover){#page-home .btn-brass:hover::before{transform:scaleX(1)}}
#page-home .btn-brass:focus-visible::before{transform:scaleX(1)}
#page-home .btn-brass:focus-visible{outline:2px solid var(--ring);outline-offset:3px}

/* ---------- HERO: the map fills the hero; the words, the paths and the map links sit over it on the left ---------- */
#page-home #home.cine{--side:max(32px,calc((100vw - 1200px)/2 + 32px));--gap:48px;--cw:min(544px,calc((100% - 2*var(--side) - var(--gap))/2));background:var(--navy);padding:0;position:relative;z-index:1;overflow:hidden;overflow:clip;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);min-height:clamp(560px,calc(100svh - var(--hdr,89px)),920px)}
#page-home #home.cine::after{content:none}
#home>.tw-stage{grid-area:1/1}
.cine-copy{grid-area:1/1;align-self:center;position:relative;z-index:3;width:var(--cw);margin-left:var(--side);padding-block:40px;text-shadow:0 1px 24px rgba(28,32,40,.45)}
.rb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb .i-play{fill:currentColor;stroke:none}
.is-paused>.i-pause{display:none}
.is-paused>.i-play{display:block}
.cine-eyebrow{display:flex;align-items:center;font:500 11.5px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--brass-2);text-wrap:balance}
.cine-eyebrow::before{content:"";flex:0 0 28px;height:1px;margin-right:12px;background:var(--brass-2);transform-origin:0 50%}
#page-home .cine-h1{font-family:var(--disp);font-weight:300;font-synthesis:none;font-variation-settings:'wght' 300,'opsz' 80;font-size:clamp(64px,min(8.5vw,15svh),100px);line-height:.95;letter-spacing:-.02em;color:var(--ivory);margin:18px 0 0}
.cine-h1 .l1,.cine-h1 .l2{display:block;white-space:normal;padding-bottom:.18em;margin-bottom:-.18em}
.cine-h1 .l1>span,.cine-h1 .l2>span{display:inline-block}
.cine-h1 .l2{font-style:italic;color:var(--ivory-3);padding-inline-start:1em}
#page-home .cine-sub{font-size:clamp(17px,1.2vw,19px);line-height:1.6;max-width:34rem;margin:24px 0 0}
.cine-paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:32px 0 0;padding:0;list-style:none}
.cine-path{position:relative;isolation:isolate;overflow:hidden;overflow:clip;display:grid;grid-template:"k a" auto "r r" 1fr/1fr 28px;align-items:start;min-height:92px;padding:14px 16px;border-radius:14px;border:1px solid rgba(244,239,232,.45);background:rgba(244,239,232,.04);color:var(--ivory);text-decoration:none;transition:border-color .5s var(--ease-out)}
.cine-path::before{content:"";position:absolute;inset:0;background:var(--navy-2);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease-out);z-index:-1}
.cine-path .pk{grid-area:k;font:500 11px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:rgba(244,239,232,.82);padding-top:5px}
.cine-path .pr{grid-area:r;align-self:end;position:relative;font-family:var(--serif);font-style:italic;font-weight:300;font-variation-settings:'wght' 300;font-size:clamp(22px,1.9vw,28px);line-height:1.1;color:var(--ivory);margin-top:10px;white-space:nowrap}
.cine-path .pa{grid-area:a;width:28px;height:28px;border-radius:50%;border:1px solid var(--brass-2);display:grid;place-items:center;transition:background .3s var(--ease-out)}
.cine-path .pa svg{width:12px;height:12px;fill:none;stroke:var(--ivory);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease-out),stroke .3s}
@supports (content:"a" / ""){
.cine-path .pr::before{content:attr(data-r) / "";position:absolute;left:0;bottom:0;font-style:normal;font-variation-settings:'wght' 500,'opsz' 36;color:var(--ivory);opacity:0;transition:opacity .45s var(--ease-out)}
.cine-path:focus-visible .pr{color:transparent}.cine-path:focus-visible .pr::before{opacity:1}
@media (hover:hover){.cine-path:hover .pr{color:transparent}.cine-path:hover .pr::before{opacity:1}}}
.cine-path:focus-visible::before{transform:scaleX(1)}
.cine-path:focus-visible{border-color:var(--brass-2);outline:2px solid var(--ivory-3);outline-offset:3px}
.cine-path:focus-visible .pa{background:var(--brass-2)}.cine-path:focus-visible .pa svg{stroke:var(--navy);transform:translateX(3px)}
@media (hover:hover){.cine-path:hover::before{transform:scaleX(1)}.cine-path:hover{border-color:var(--brass-2)}.cine-path:hover .pa{background:var(--brass-2)}.cine-path:hover .pa svg{stroke:var(--navy);transform:translateX(3px)}}
@media (hover:none){.cine-path .pa{background:var(--brass-2)}.cine-path .pa svg{stroke:var(--navy)}.cine-path:active::before{transform:scaleX(1);transition:none}}

/* reviews, a band of their own under the map; the analyzer sheet rises over its last 28px */
#page-home #reviews.band{padding:clamp(48px,6vw,72px) 0 calc(clamp(48px,6vw,72px) + 28px);border-top:1px solid rgba(244,239,232,.12)}
#home-reviews{max-width:880px}
.rv-head{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:4px 8px;flex-wrap:wrap}
#page-home .rv-label{font:500 11px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ivory-3)}
.rv-ctl{display:none;align-items:center;gap:6px}
.js .rv-ctl{display:flex}
.rb{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(244,239,232,.3);background:transparent;color:var(--ivory);display:grid;place-items:center;cursor:pointer;transition:border-color .25s}
.rb:hover{border-color:var(--brass-2)}
.rb:not(.is-paused)>.i-play{display:none}
.rv-dots{display:flex}
.rv-dots button{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;transition:width .35s var(--ease-out)}
.rv-dots button::before{content:"";width:8px;height:8px;border-radius:4px;background:rgba(244,239,232,.5);transition:width .35s var(--ease-out),background .35s}
.rv-dots button[aria-current="true"]{width:32px}
.rv-dots button[aria-current="true"]::before{width:16px;background:var(--brass-2)}
@media (max-width:359px){#page-home .rv-dots{display:none}}
@media (max-width:379px){.cine-eyebrow{letter-spacing:.14em}}

.rv-slide{margin:0}
.rv-slide+.rv-slide{margin-top:22px}
.js .rv-stack{display:grid;touch-action:pan-y pinch-zoom}
.js .rv-slide{grid-area:1/1;margin:0;transition:opacity .7s var(--ease-out),filter .7s var(--ease-out),visibility 0s}
.js .rv-slide:not(.on){opacity:0;filter:blur(6px);visibility:hidden;transition:opacity .7s var(--ease-out),filter .7s var(--ease-out),visibility 0s linear .7s}
.rv-stars{display:block;color:var(--brass-2);font-size:14px;letter-spacing:.2em;margin:18px 0 10px}
#page-home .rv-slide blockquote p{font-family:var(--serif);font-style:italic;font-weight:300;font-variation-settings:'wght' 300;font-size:clamp(19px,1.9vw,26px);line-height:1.45;color:var(--ivory);text-indent:-.4em;max-width:42em}
#page-home .rv-slide figcaption{font:400 14px/1.4 var(--sans);letter-spacing:.02em;color:rgba(244,239,232,.72);margin-top:14px}

</style>
<style id="c3-home-v2b">
/* ---------- ANALYZER SHEET ---------- */
#page-home #ltr-teaser.sheet{margin-top:-28px;border-radius:28px 28px 0 0;z-index:2;box-shadow:0 -18px 48px rgba(0,0,0,.22);padding-top:clamp(72px,8vw,112px);overflow:visible}
.w.an{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}
#ltr-teaser h2{max-width:14ch}
#page-home .an-text{max-width:34rem;margin-top:20px}
.an-card{background:#fff;border:1px solid var(--rule);border-radius:20px;padding:24px;box-shadow:0 18px 50px rgba(28,32,40,.10)}
.an-f{display:block}
.an-l{display:block;margin-bottom:6px;font:500 11px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass-ink)}
.an-card input{display:block;width:100%;height:52px;border-radius:10px;border:1px solid rgba(28,32,40,.62);background:#fff;color:var(--navy);font:16px var(--sans);padding:0 14px;transition:border-color .16s,box-shadow .16s}
#page-home .an-card input:focus,#page-home .an-card input:focus-visible{outline:2px solid transparent;outline-offset:0;border-color:var(--brass-ink);box-shadow:0 0 0 2px var(--brass-ink)}
.an-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;margin-top:12px}
.an-rail{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.an-rail i{display:block;height:2px;background:rgba(28,32,40,.12);position:relative;overflow:hidden}
.an-rail i::after{content:"";position:absolute;inset:0;background:var(--brass-ink);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s var(--ease-out)}
.an-rail i.ok::after{transform:scaleX(1)}
#page-home .an-go{display:flex;width:100%;justify-content:center;min-height:54px;margin-top:14px;font-size:.78rem}
#page-home .an-card.is-ready .an-go::before{transform:scaleX(1)}
.an-card.is-ready .an-go .arr{transform:translateX(4px)}

/* ---------- WHY ---------- */
#page-home #why-us{padding:clamp(72px,9vw,120px) 0}
#page-home .why-ln{width:48px;height:1px;background:var(--brass-2);margin-bottom:20px}
#why-us h2{max-width:20ch}
#page-home .why-stats-8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:48px 24px;padding-top:0;margin-top:56px}
#page-home .why-stats-8 .why-stat{display:flex;gap:12px;align-items:flex-start;text-align:left;padding-top:24px;position:relative}
#page-home .why-stats-8 .why-stat::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);transform-origin:0 50%;transition:transform .52s var(--ease-out) calc(var(--i)*70ms)}
#page-home .why-stats-8 .why-stat:hover{transform:none!important}
#page-home .why-stats-8 .why-stat::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--brass-2);transform:scaleX(0);transform-origin:0 50%;transition:transform .5s var(--ease-out)}
@media (hover:hover){#page-home .why-stats-8 .why-stat:hover::after{transform:scaleX(1)}}
#page-home .why-stats-8 .why-ico{flex:0 0 32px;width:32px;height:32px;margin-top:1px;color:var(--brass-2)}
#page-home .why-stats-8 .why-ico svg{width:32px;height:32px;display:block;stroke-width:1.6}
#page-home .why-ico :is(path,rect,circle){stroke-dasharray:1 2;stroke-dashoffset:0;transition:stroke-dashoffset .9s var(--ease-io) calc(var(--i)*70ms)}
#page-home .why-stats-8 .stat-kpi{display:block;font-family:var(--serif);font-weight:400;font-variation-settings:'wght' 620,'opsz' 36;font-synthesis:none;font-size:1.45rem;line-height:1.15;color:var(--brass-2);transform:none;text-shadow:none;transition:color .6s ease calc(var(--i)*70ms + .5s)}
#page-home .why-stats-8 .stat-label{margin-top:.35rem;font:400 15.3px/1.5 var(--sans);letter-spacing:.01em;text-transform:none;color:rgba(244,239,232,.78)}
#page-home .why-cta{margin-top:48px}

/* ---------- TEAM ---------- */
#team h2{max-width:16ch}
.tm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin:48px 0 0;padding:0;list-style:none}
.tm{position:relative;padding-top:28px}
.tm::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);transform-origin:0 50%;transition:transform .52s var(--ease-out) calc(var(--i)*120ms)}
.tp{width:160px;height:160px;border-radius:12px;overflow:hidden;overflow:clip;outline:1px solid rgba(145,89,43,.5);outline-offset:6px;transition:outline-offset .3s var(--ease-out);margin:6px 0 0 6px}
.tp img{display:block;width:100%!important;height:100%!important;object-fit:cover;object-position:center top;transition:transform 1.2s var(--ease-out) calc(var(--i)*120ms)}
@media (hover:hover){.tm:hover .tp{outline-offset:10px}}
#page-home .tm-name{font-family:var(--serif);font-weight:400;font-variation-settings:'wght' 400;font-size:1.45rem;line-height:1.2;color:var(--fg);margin-top:22px}
#page-home .tm-role{font:500 11.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);margin-top:8px}
#page-home .tm-bio{font-size:16px;line-height:1.65;max-width:36ch;margin-top:12px}
#page-home .tm-more{margin-top:40px}

/* ---------- FAQ ---------- */
.w.faq{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:64px;align-items:start}
.qa{padding:28px 0;position:relative}
.qa::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--line);transform-origin:0 50%;transition:transform .52s var(--ease-out) calc(var(--i)*90ms)}
#page-home .qa h3{font-family:var(--serif);font-weight:400;font-variation-settings:'wght' 400;font-size:22px;line-height:1.3;letter-spacing:-.01em;color:var(--fg)}
#page-home .qa p{line-height:1.7;max-width:62ch;margin-top:10px}
#page-home .qa h3{text-wrap:balance}
@media (min-width:700px) and (max-width:899px){#page-home .tm-bio{grid-column:2;max-width:36em}}

/* ---------- MOTION (only when the visitor allows it) ---------- */
@media (prefers-reduced-motion:no-preference){
.cine-eyebrow::before{animation:line-in .52s var(--ease-out) .15s both}
@keyframes line-in{from{transform:scaleX(0)}}
.cine-h1 .l1>span,.cine-h1 .l2>span{animation:h1-rise 1s var(--ease-out) .1s both}
.cine-h1 .l2>span{animation-delay:.22s}
.cine-h1 .l1,.cine-h1 .l2{overflow-x:visible;overflow-y:clip}
@keyframes h1-rise{from{transform:translateY(102%)}}
.m .eb[data-io]:not(.in)::before,.m .ln[data-io]:not(.in),.m .why-stats[data-io]:not(.in) .why-stat::before,.m .tm-grid[data-io]:not(.in) .tm::before,.m .faq-list[data-io]:not(.in) .qa::before{transform:scaleX(0)}
.m .why-stats[data-io]:not(.in) .why-ico :is(path,rect,circle){stroke-dashoffset:1.01}
.m .why-stats[data-io]:not(.in) .stat-kpi{color:var(--ivory-3)}
.m .tm-grid[data-io]:not(.in) .tp img{transform:scale(1.08)}
@media (hover:hover){#page-home .why-stat:hover .why-ico :is(path,rect,circle){animation:redraw .9s var(--ease-io)}}
