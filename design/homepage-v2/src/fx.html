<script>
/* Homepage effects, 2026-09 redesign. No libraries, no rAF loop, no canvas.
   Everything here is enhancement: with this script gone the page is complete and still. */
(function () {
  'use strict';
  clearTimeout(window.__c3T);
  var html = document.documentElement;
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)');
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var hasIO = 'IntersectionObserver' in window;

  /* ---- one-shot reveals: decoration only (lines, strokes, portrait scale, badge colour) ---- */
  var ioTargets = $$('[data-io]');
  function revealAll() { ioTargets.forEach(function (el) { el.classList.add('in'); }); }
  if (hasIO) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0 });
    ioTargets.forEach(function (el) { io.observe(el); });
  } else revealAll();
  window.addEventListener('beforeprint', revealAll);

  /* ---- the gate: one place decides whether the film and the reviews may run ---- */
  var stage = $('#home.cine'), v = $('.cine-video'), pb = $('.cine-pause');
  var rvBox = $('#home-reviews'), pop = document.getElementById('c3-pop');
  /* userPlay: the visitor pressed play, which overrides a reduced-motion setting; rvStopped: they stopped the reviews */
  var G = { vis: !document.hidden, pop: pop ? pop.hidden : true, film: false, rv: false, hov: false, userVid: false, userPlay: false, rvStopped: false };
  var film = { state: 'idle', plays: 0, last: 0, run: function () {} };
  var rv = { run: function () {} };
  function sync() {
    film.run(G.vis && G.pop && G.film && !G.userVid && (G.userPlay || !rm.matches));
    rv.run(G.vis && G.pop && G.rv && !G.hov && !G.rvStopped && !rm.matches);
  }
  /* a tab shown before 'load' waits for load, so the film never competes with the poster and fonts */
  document.addEventListener('visibilitychange', function () { G.vis = !document.hidden; if (G.vis && document.readyState === 'complete') whenIdle(startFilm); sync(); });
  if (pop && 'MutationObserver' in window) {
    new MutationObserver(function () { G.pop = pop.hidden; sync(); }).observe(pop, { attributes: true, attributeFilter: ['hidden'] });
  }
  if (hasIO) {
    var gio = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.target === rvBox) G.rv = e.intersectionRatio >= 0.5;
        else G.film = e.isIntersecting;
      });
      sync();
    }, { threshold: [0, 0.5] });
    if (stage) gio.observe($('.cine-film'));
    if (rvBox) gio.observe(rvBox);
  }

  /* ---- the film: loads after the page, never on reduced motion, Save-Data or 2G ---- */
  function setVidBtn(paused) {
    if (!pb) return;
    pb.classList.toggle('is-paused', paused);
    pb.setAttribute('aria-label', paused ? 'Play the video' : 'Pause the video');
  }
  function abortFilm() {
    if (film.state === 'ready') return;
    film.state = 'dead';
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
    stage.classList.remove('is-playing');
    if (pb) pb.hidden = true;
  }
  function startFilm() {
    if (!v || !stage || film.state !== 'idle') return;
    var c = navigator.connection || {};
    if (rm.matches || c.saveData || /(^|-)[23]g$/.test(c.effectiveType || '') || document.hidden || !hasIO) return;
    /* a tall screen gets the 9:16 cut, which fills it without upscaling a 16:9 frame */
    var h264 = v.canPlayType('video/mp4; codecs="avc1.64001F"');
    var tall = window.matchMedia('(max-aspect-ratio:1/1)').matches;
    var src = h264 ? v.getAttribute(tall ? 'data-mp4-tall' : 'data-mp4') : (v.canPlayType('video/webm; codecs="vp9"') ? v.getAttribute(tall ? 'data-webm-tall' : 'data-webm') : '');
    if (!src) return;
    film.state = 'loading';
    v.muted = true; v.defaultMuted = true;
    v.src = src;
    var timer = setTimeout(abortFilm, 4000);
    v.addEventListener('playing', function () {
      clearTimeout(timer);
      if (film.state !== 'loading') return;
      film.state = 'ready';
      stage.classList.add('is-playing');
      if (pb) pb.hidden = false;
      sync();
    }, { once: true });
    var p = v.play();
    if (p && p.catch) p.catch(abortFilm);
  }
  film.run = function (on) {
    if (film.state !== 'ready') return;
    if (on) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    else v.pause();
  };
  if (v) {
    /* three plays, then it rests on the poster */
    v.addEventListener('timeupdate', function () {
      var t = v.currentTime;
      if (film.state === 'ready' && t < film.last - 1 && ++film.plays >= 3) {
        film.state = 'rest'; v.pause(); stage.classList.remove('is-playing'); setVidBtn(true);
      }
      film.last = t;
    });
  }
  if (pb) pb.addEventListener('click', function () {
    if (film.state === 'rest') { film.state = 'ready'; film.plays = 0; film.last = 0; stage.classList.add('is-playing'); G.userVid = false; G.userPlay = true; setVidBtn(false); sync(); return; }
    G.userVid = !G.userVid; if (!G.userVid) G.userPlay = true; setVidBtn(G.userVid); sync();
  });
  function whenIdle(fn) { if ('requestIdleCallback' in window) requestIdleCallback(fn, { timeout: 2500 }); else setTimeout(fn, 1200); }
  if (document.readyState === 'complete') whenIdle(startFilm);
  else window.addEventListener('load', function () { whenIdle(startFilm); });

  /* ---- reviews: dissolve in place every 7s while visible; any manual step stops rotation ---- */
  if (rvBox) (function () {
    var stack = $('.rv-stack', rvBox), slides = $$('.rv-slide', rvBox), dots = $$('.rv-dots button', rvBox);
    var rot = $('.rv-rot', rvBox), i = 0, t = 0;
    if (slides.length < 2) return;
    if (rm.matches) stack.setAttribute('aria-live', 'polite');
    function show(n) {
      i = (n + slides.length) % slides.length;
      slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
      dots.forEach(function (d, k) { d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    }
    function setRot(stopped) {
      G.rvStopped = stopped;
      rot.classList.toggle('is-paused', stopped);
      rot.setAttribute('aria-label', stopped ? 'Play reviews' : 'Pause reviews');
      stack.setAttribute('aria-live', stopped || rm.matches ? 'polite' : 'off');
      sync();
    }
    var rmLive = function () { stack.setAttribute('aria-live', G.rvStopped || rm.matches ? 'polite' : 'off'); };
    if (rm.addEventListener) rm.addEventListener('change', rmLive); else if (rm.addListener) rm.addListener(rmLive);
    function manual(n) { show(n); setRot(true); }
    rv.run = function (on) { clearTimeout(t); if (on) t = setTimeout(function () { show(i + 1); sync(); }, 7000); };
    rot.addEventListener('click', function () { setRot(!G.rvStopped); });
    $('.rv-prev', rvBox).addEventListener('click', function () { manual(i - 1); });
    $('.rv-next', rvBox).addEventListener('click', function () { manual(i + 1); });
    dots.forEach(function (d, k) { d.addEventListener('click', function () { manual(k); }); });
    rvBox.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { G.hov = true; sync(); } });
    rvBox.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { G.hov = false; sync(); } });
    /* WAI APG carousel: keyboard focus entering the carousel stops rotation until the visitor presses play */
    rvBox.addEventListener('focusin', function (e) {
      var kb = false; try { kb = e.target.matches(':focus-visible'); } catch (x) {}
      if (!G.rvStopped && kb && !rvBox.contains(e.relatedTarget)) setRot(true);
    });
    var sx = 0, sy = 0, sw = false;
    stack.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; sw = true; sx = e.clientX; sy = e.clientY; });
    stack.addEventListener('pointerup', function (e) {
      if (!sw) return; sw = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) manual(i + (dx < 0 ? 1 : -1));
    });
    stack.addEventListener('pointercancel', function () { sw = false; });
  })();

  /* ---- analyzer: a three-part rail fills as each field becomes usable; never blocks submit ---- */
  var card = $('.an-card');
  if (card) (function () {
    var tests = {
      'sbh-street': function (s) { return s.length >= 5 && /\d/.test(s) && /[a-z]{2}/i.test(s); },
      'sbh-city': function (s) { return s.length >= 2; },
      'sbh-zip': function (s) { return /^\d{5}(-?\d{4})?$/.test(s); }
    };
    function check() {
      var all = true;
      Object.keys(tests).forEach(function (id) {
        var el = document.getElementById(id), ok = !!el && tests[id](el.value.trim());
        var seg = $('.an-rail i[data-for="' + id + '"]', card);
        if (seg) seg.classList.toggle('ok', ok);
        if (!ok) all = false;
      });
      card.classList.toggle('is-ready', all);
    }
    card.addEventListener('input', check);
  })();

  /* ---- towns: when the map comes into view the camera tilts down from overhead and turns; after that it turns slowly
     while the map is on screen and holds still under the pointer or keyboard focus. The compositor plays both motions:
     each moving element gets transform keyframes computed here with the projection head.html uses, so the page does no
     style work per frame. With no motion allowed nothing here runs and the CSS draws the map at rest. ---- */
  var tw = $('#towns'), tst = tw && $('.tw-stage', tw);
  var towns = { stop: function () {}, sync: function () {} };
  if (tst && hasIO && tst.animate) (function () {
    var plane = $('.tw-plane', tst), pts = $$('.tw-pt', tst), wls = $$('.tw-deco .wl i', tst), needle = $('.tw-compass i', tst);
    var R = Math.PI / 180, flown = false, landed = false, vis = false, hold = false, fly = [], turn = [];
    function num(cs, k) { return parseFloat(cs.getPropertyValue(k)) || 0; }
    function camera() {
      var cs = getComputedStyle(tw);
      return { P: num(cs, '--P'), pw: num(cs, '--pw'), hw: num(cs, '--hw'), tx: num(cs, '--tx'), ty: num(cs, '--ty'), t0: num(cs, '--t0'), h0: num(cs, '--h0'), h1: num(cs, '--h1'),
        at: pts.map(function (el) { var s = getComputedStyle(el); return [num(s, '--px'), num(s, '--py')]; }),
        a: wls.map(function (el) { return num(getComputedStyle(el), '--a'); }) };
    }
    /* one frame of the scene at tilt t, heading h (degrees) and zoom z */
    function pose(c, t, h, z) {
      var st = Math.sin(t * R), ct = Math.cos(t * R), sh = Math.sin(h * R), ch = Math.cos(h * R);
      return {
        plane: 'rotateX(' + t + 'deg) rotateZ(' + h + 'deg) scale(' + z + ')',
        pts: c.at.map(function (p) {
          var u = (p[0] - c.tx) * c.pw * z, v = (p[1] - c.ty) * c.pw * c.hw * z, up = u * ch - v * sh, vp = u * sh + v * ch, k = c.P / (c.P - vp * st);
          return 'translate(' + (up * k).toFixed(2) + 'px,' + (vp * ct * k).toFixed(2) + 'px)';
        }),
        wls: c.a.map(function (a) { var r = (a + h) * R; return 'translate(-50%,-50%) rotate(' + (Math.atan2(Math.sin(r) * ct, Math.cos(r)) / R).toFixed(3) + 'deg)'; }),
        needle: 'rotate(' + (Math.atan2(sh, ch * ct) / R).toFixed(3) + 'deg)'
      };
    }
    function play(c, samples, opts) {
      var fr = samples.map(function (s) { return pose(c, s[0], s[1], s[2]); }), out = [];
      /* an element the CSS hides at this width is left alone: animating it would tick on the main thread */
      var put = function (el, key, i) { if (el.getClientRects().length) out.push(el.animate(fr.map(function (f) { return { transform: i < 0 ? f[key] : f[key][i] }; }), opts)); };
      put(plane, 'plane', -1);
      pts.forEach(function (el, i) { put(el, 'pts', i); });
      wls.forEach(function (el, i) { put(el, 'wls', i); });
      if (needle) put(needle, 'needle', -1);
      return out;
    }
    /* the flight follows the page's ease-out curve, cubic-bezier(.16,1,.3,1), baked into 48 frames */
    function ease(x) {
      var lo = 0, hi = 1, t = x;
      for (var n = 0; n < 30; n++) { t = (lo + hi) / 2; if (3 * .16 * t * (1 - t) * (1 - t) + 3 * .3 * t * t * (1 - t) + t * t * t < x) lo = t; else hi = t; }
      return 3 * t * (1 - t) * (1 - t) + 3 * t * t * (1 - t) + t * t * t;
    }
    function takeOff() {
      var c = camera(), s = [];
      for (var i = 0; i <= 48; i++) { var p = ease(i / 48); s.push([c.t0 * p, c.h0 - 28 + 28 * p, .78 + .22 * p]); }
      fly = play(c, s, { duration: 2600, easing: 'linear' });
      fly[0].finished.then(function () { landed = true; sync(); }, function () {});
    }
    function sync() {
      var on = landed && vis && !hold && !rm.matches;
      if (on && !turn.length) {
        var c = camera(), s = [];
        for (var i = 0; i <= 12; i++) s.push([c.t0, c.h0 + (c.h1 - c.h0) * i / 12, 1]);
        turn = play(c, s, { duration: 18000, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
      }
      turn.forEach(function (a) { if (on) a.play(); else a.pause(); });
    }
    towns.sync = sync;
    towns.stop = function () {
      fly.concat(turn).forEach(function (a) { a.cancel(); }); fly = []; turn = []; landed = flown = true;
      tst.classList.remove('pre'); tst.classList.add('in');
    };
    /* before the map comes into view the camera goes overhead; once it is in view the flight starts from there */
    new IntersectionObserver(function (es) {
      if (es[es.length - 1].isIntersecting && !flown && html.classList.contains('m') && !rm.matches) tst.classList.add('pre');
    }, { rootMargin: '0px 0px 60% 0px' }).observe(tst);
    new IntersectionObserver(function (es) {
      vis = es[es.length - 1].isIntersecting;
      if (vis && !flown) {
        flown = true;
        if (tst.classList.contains('pre')) takeOff(); else landed = true;
        tst.classList.remove('pre'); tst.classList.add('in');
      }
      sync();
    }, { rootMargin: '0px 0px -12% 0px' }).observe(tst);
    tst.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { hold = true; sync(); } });
    tst.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { hold = false; sync(); } });
    tst.addEventListener('focusin', function () { hold = true; sync(); });
    tst.addEventListener('focusout', function (e) { if (!tst.contains(e.relatedTarget)) { hold = false; sync(); } });
    /* a new width can mean a new camera: the turn restarts from rest with fresh frames */
    var rz = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rz);
      rz = setTimeout(function () { if (!landed) return; turn.forEach(function (a) { a.cancel(); }); turn = []; sync(); }, 250);
    });
    window.addEventListener('beforeprint', function () { tst.classList.add('in'); });
  })();
  else if (tst) tst.classList.add('in');

  /* ---- motion preference can change while the page is open ---- */
  var onRm = function () {
    if (rm.matches) {
      html.classList.remove('m'); revealAll(); towns.stop();
      if (film.state === 'ready') { G.userPlay = false; film.state = 'rest'; v.pause(); stage.classList.remove('is-playing'); setVidBtn(true); }
    } else {
      if (hasIO) html.classList.add('m');
      if (document.readyState === 'complete') whenIdle(startFilm);
      towns.sync();
    }
    sync();
  };
  if (rm.addEventListener) rm.addEventListener('change', onRm); else if (rm.addListener) rm.addListener(onRm);

  /* the hero fills the first screen under the header, and keyboard focus never lands under it; the header is 89px today */
  var hd = document.querySelector('body > header, header');
  if (hd && hd.offsetHeight) {
    html.style.scrollPaddingTop = (hd.offsetHeight + 8) + 'px';
    if (stage && hd.offsetHeight !== 89) stage.style.setProperty('--hdr', hd.offsetHeight + 'px');
  }
})();
</script>
