  document.addEventListener('visibilitychange', function () { G.vis = !document.hidden; if (G.vis && document.readyState === 'complete') whenIdle(startFilm); sync(); });
  if (pop && 'MutationObserver' in window) {

  }

      es.forEach(function (e) {
        if (e.target === rvBox) G.rv = e.intersectionRatio >= 0.5;
        else G.film = e.isIntersecting;

      sync();
    }, { threshold: [0, 0.5] });
    if (stage) gio.observe($('.cine-film'));
    if (rvBox) gio.observe(rvBox);

    if (!pb) return;
    pb.classList.toggle('is-paused', paused);
    pb.setAttribute('aria-label', paused ? 'Play the video' : 'Pause the video');
  }
  function abortFilm() {
    if (film.state === 'ready') return;
    film.state = 'dead';
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
    stage.classList.remove('is-playing');
    if (pb) pb.hidden = true;
  }
  function startFilm() {
    if (!v || !stage || film.state !== 'idle') return;
    var c = navigator.connection || {};
    if (rm.matches || c.saveData || /(^|-)[23]g$/.test(c.effectiveType || '') || document.hidden || !hasIO) return;

    var tall = window.matchMedia('(max-aspect-ratio:1/1)').matches;
    var src = h264 ? v.getAttribute(tall ? 'data-mp4-tall' : 'data-mp4') : (v.canPlayType('video/webm; codecs="vp9"') ? v.getAttribute(tall ? 'data-webm-tall' : 'data-webm') : '');

    if (rm.addEventListener) rm.addEventListener('change', rmLive); else if (rm.addListener) rm.addListener(rmLive);

    $('.rv-next', rvBox).addEventListener('click', function () { manual(i + 1); });
    dots.forEach(function (d, k) { d.addEventListener('click', function () { manual(k); }); });
    rvBox.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { G.hov = true; sync(); } });
    rvBox.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { G.hov = false; sync(); } });

    rvBox.addEventListener('focusin', function (e) {

    stack.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; sw = true; sx = e.clientX; sy = e.clientY; });

  var card = $('.an-card');
  if (card) (function () {
    var tests = {
      'sbh-street': function (s) { return s.length >= 5 && /\d/.test(s) && /[a-z]{2}/i.test(s); },
      'sbh-city': function (s) { return s.length >= 2; },

  var hd = document.querySelector('body > header, header');

        tst.classList.remove('pre'); tst.classList.add('in');
        fly.forEach(function (a) { a.play(); });
        if (!fly.length) { land(); sync(); return; }
        fly[0].finished.then(function () { landed = true; tst.classList.remove('lod'); sync(); }, function () {});
      };
      /* the flight waits for its maps, up to 1.5s, so it does not play over an empty plane on a slow link */
      var need = [img].concat(zoom ? lods.map(function (l) { return l.img; }) : []).filter(function (im) { return im && !ok(im) && im.decode; });
      if (!need.length) return go();
      var n = need.length, t = setTimeout(go, 1500), done = function () { if (--n <= 0) { clearTimeout(t); go(); } };
      need.forEach(function (im) { im.decode().then(done, done); });
    }
    /* the flight jumps to its last frame: keyboard focus in the map, the pause button, a new breakpoint, printing */
    function end() {
      if (landed) return;
      tst.classList.add('now');
      requestAnimationFrame(function () { requestAnimationFrame(function () { tst.classList.remove('now'); }); });
      if (started) fly.forEach(function (a) { a.finish(); });
      else { fly.forEach(function (a) { a.cancel(); }); fly = []; land(); }
    }
    function sync() {
      var on = landed && vis && !hov && !foc && !stopped && !rm.matches;
      if (on && !turn.length) {
        var c = camera(), s = [];
        for (var i = 0; i <= 12; i++) s.push({ t: c.t0, h: c.h0 + (c.h1 - c.h0) * i / 12, z: 1, dx: 0, dy: 0 });
        turn = play(c, s, null, { duration: 18000, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
      }
      turn.forEach(function (a) { if (on) a.play(); else a.pause(); });
    }
    towns.sync = sync;
    towns.stop = function () {
      fly.concat(turn).forEach(function (a) { a.cancel(); }); fly = []; turn = []; land();
    };
    /* the zoom maps start loading well before the map arrives */
    if (canZoom) new IntersectionObserver(function (es, ob) {
      if (es[es.length - 1].isIntersecting && html.classList.contains('m') && !rm.matches) { load(); ob.disconnect(); }
    }, { rootMargin: '0px 0px 250% 0px' }).observe(tst);
    /* just before the map comes into view the flight's first frame is set; once it is in view the flight starts */
    new IntersectionObserver(function (es) {
      if (es[es.length - 1].isIntersecting && !flown && html.classList.contains('m') && !rm.matches && !tst.classList.contains('pre')) { tst.classList.add('pre'); prep(); }
    }, { rootMargin: '0px 0px 60% 0px' }).observe(tst);
    new IntersectionObserver(function (es) {
      vis = es[es.length - 1].isIntersecting;
      if (vis && !flown) {
        flown = true;
        if (html.classList.contains('m') && !rm.matches) {
          /* both observers can report in the same frame (a jump, or a reload with the scroll restored): the first frame
             must be styled once, or the labels show from the start and the landing is lost */
          if (!tst.classList.contains('pre')) { tst.classList.add('pre'); prep(); getComputedStyle(pts[0] || tst).opacity; }
          takeOff();
        } else land();
      }
      sync();
    }, { rootMargin: '0px 0px -12% 0px' }).observe(tst);
    /* the turn holds while the pointer is on a town label, not anywhere over the map */
    $$('.tw-pin a', tst).forEach(function (a) {
      a.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { hov = true; sync(); } });
      a.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { hov = false; sync(); } });
    });
    /* keyboard focus in the map brings it to rest at once, so the focused label is visible and on its town */
    tst.addEventListener('focusin', function (e) {
      foc = !!(e.target.closest && e.target.closest('.tw-pin'));
      end();
      sync();
    });
    tst.addEventListener('focusout', function (e) { if (!tst.contains(e.relatedTarget)) { foc = false; sync(); } });
    if (btn) {
      btn.hidden = false;
      btn.addEventListener('click', function () {
        stopped = !stopped;
        btn.classList.toggle('is-paused', stopped);
        btn.setAttribute('aria-label', stopped ? 'Play the map' : 'Pause the map');
        if (stopped) end();
        sync();
      });
    }
    /* a resize that crosses a breakpoint changes the camera: the flight jumps to its end, or the turn restarts from rest with
       new frames. Any other resize, such as a phone's address bar showing or hiding, changes nothing the frames use. A
       flight that has not started yet is set up again for the new size. */
    var rz = 0;
    window.addEventListener('resize', function () {
      if (rz) return;
      rz = requestAnimationFrame(function () {
        rz = 0;
        if (fly.length && !started && !landed) { prep(); return; }
        if (!fly.length && !turn.length) return;
        if (JSON.stringify(camera()) === cam) return;
        if (!landed) { end(); return; }
        turn.forEach(function (a) { a.cancel(); }); turn = []; sync();
      });
    });
    window.addEventListener('beforeprint', function () { end(); tst.classList.remove('pre'); tst.classList.add('in'); });
  })();
  else if (tst) tst.classList.add('in');

  /* ---- the motion preference can change while the page is open: the map stops, or starts turning again ---- */
  var onRm = function () { if (rm.matches) towns.stop(); else towns.sync(); };
  if (rm.addEventListener) rm.addEventListener('change', onRm); else if (rm.addListener) rm.addListener(onRm);
})();
</script>
