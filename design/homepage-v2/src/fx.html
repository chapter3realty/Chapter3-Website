<script>
/* Homepage effects, 2026-09 redesign. No libraries, no rAF loop, no canvas.
   Everything here is enhancement: with this script gone the page is complete and still. */
(function () {
  'use strict';
  clearTimeout(window.__c3T);
  var html = document.documentElement;
  var rm = window.matchMedia('(prefers-reduced-motion: reduce)');
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var hasIO = 'IntersectionObserver' in window;

  /* ---- one-shot reveals: decoration only (lines, strokes, portrait scale, badge colour) ---- */
  var ioTargets = $$('[data-io]');
  function revealAll() { ioTargets.forEach(function (el) { el.classList.add('in'); }); }
  if (hasIO) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0 });
    ioTargets.forEach(function (el) { io.observe(el); });
  } else revealAll();
  window.addEventListener('beforeprint', revealAll);

  /* ---- the gate: one place decides whether the film and the reviews may run ---- */
  var stage = $('#home.cine'), v = $('.cine-video'), pb = $('.cine-pause');
  var rvBox = $('#home-reviews'), pop = document.getElementById('c3-pop');
  var G = { vis: !document.hidden, pop: pop ? pop.hidden : true, film: false, rv: false, hov: false, foc: false, userVid: false, rvStopped: rm.matches };
  var film = { state: 'idle', plays: 0, last: 0, run: function () {} };
  var rv = { run: function () {} };
  function sync() {
    film.run(G.vis && G.pop && G.film && !G.userVid && !rm.matches);
    rv.run(G.vis && G.pop && G.rv && !G.hov && !G.foc && !G.rvStopped && !rm.matches);
  }
  document.addEventListener('visibilitychange', function () { G.vis = !document.hidden; if (G.vis) startFilm(); sync(); });
  if (pop && 'MutationObserver' in window) {
    new MutationObserver(function () { G.pop = pop.hidden; sync(); }).observe(pop, { attributes: true, attributeFilter: ['hidden'] });
  }
  if (hasIO) {
    var gio = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.target === rvBox) G.rv = e.intersectionRatio >= 0.5;
        else G.film = e.isIntersecting;
      });
      sync();
    }, { threshold: [0, 0.5] });
    if (stage) gio.observe($('.cine-film'));
    if (rvBox) gio.observe(rvBox);
  }

  /* ---- the film: loads after the page, never on reduced motion, Save-Data or 2G ---- */
  function setVidBtn(paused) {
    if (!pb) return;
    pb.classList.toggle('is-paused', paused);
    pb.setAttribute('aria-label', paused ? 'Play the video' : 'Pause the video');
  }
  function abortFilm() {
    if (film.state === 'ready') return;
    film.state = 'dead';
    try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
    stage.classList.remove('is-playing');
    if (pb) pb.hidden = true;
  }
  function startFilm() {
    if (!v || !stage || film.state !== 'idle') return;
    var c = navigator.connection || {};
    if (rm.matches || c.saveData || /(^|-)2g$/.test(c.effectiveType || '') || document.hidden || !hasIO) return;
    var h264 = v.canPlayType('video/mp4; codecs="avc1.64001F"');
    var small = window.matchMedia('(max-width:699px)').matches || c.effectiveType === '3g';
    var src = h264 ? (small ? v.getAttribute('data-mp4-sm') : v.getAttribute('data-mp4')) : (v.canPlayType('video/webm; codecs="vp9"') ? v.getAttribute('data-webm') : '');
    if (!src) return;
    film.state = 'loading';
    v.muted = true; v.defaultMuted = true;
    v.src = src;
    var timer = setTimeout(abortFilm, 4000);
    v.addEventListener('playing', function () {
      clearTimeout(timer);
      if (film.state !== 'loading') return;
      film.state = 'ready';
      stage.classList.add('is-playing');
      if (pb) pb.hidden = false;
      sync();
    }, { once: true });
    var p = v.play();
    if (p && p.catch) p.catch(abortFilm);
  }
  film.run = function (on) {
    if (film.state !== 'ready') return;
    if (on) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    else v.pause();
  };
  if (v) {
    /* three plays, then it rests on the poster */
    v.addEventListener('timeupdate', function () {
      var t = v.currentTime;
      if (film.state === 'ready' && t < film.last - 1 && ++film.plays >= 3) {
        film.state = 'rest'; v.pause(); stage.classList.remove('is-playing'); setVidBtn(true);
      }
      film.last = t;
    });
  }
  if (pb) pb.addEventListener('click', function () {
    if (film.state === 'rest') { film.state = 'ready'; film.plays = 0; film.last = 0; stage.classList.add('is-playing'); G.userVid = false; setVidBtn(false); sync(); return; }
    G.userVid = !G.userVid; setVidBtn(G.userVid); sync();
  });
  function whenIdle(fn) { if ('requestIdleCallback' in window) requestIdleCallback(fn, { timeout: 2500 }); else setTimeout(fn, 1200); }
  if (document.readyState === 'complete') whenIdle(startFilm);
  else window.addEventListener('load', function () { whenIdle(startFilm); });

  /* ---- reviews: dissolve in place every 7s while visible; any manual step stops rotation ---- */
  if (rvBox) (function () {
    var stack = $('.rv-stack', rvBox), slides = $$('.rv-slide', rvBox), dots = $$('.rv-dots button', rvBox);
    var rot = $('.rv-rot', rvBox), i = 0, t = 0;
    if (slides.length < 2) return;
    if (rm.matches) stack.setAttribute('aria-live', 'polite');
    function show(n) {
      i = (n + slides.length) % slides.length;
      slides.forEach(function (s, k) { s.classList.toggle('on', k === i); });
      dots.forEach(function (d, k) { d.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    }
    function setRot(stopped) {
      G.rvStopped = stopped;
      rot.classList.toggle('is-paused', stopped);
      rot.setAttribute('aria-label', stopped ? 'Play reviews' : 'Pause reviews');
      stack.setAttribute('aria-live', stopped ? 'polite' : 'off');
      sync();
    }
    function manual(n) { show(n); setRot(true); }
    rv.run = function (on) { clearTimeout(t); if (on) t = setTimeout(function () { show(i + 1); sync(); }, 7000); };
    rot.addEventListener('click', function () { setRot(!G.rvStopped); });
    $('.rv-prev', rvBox).addEventListener('click', function () { manual(i - 1); });
    $('.rv-next', rvBox).addEventListener('click', function () { manual(i + 1); });
    dots.forEach(function (d, k) { d.addEventListener('click', function () { manual(k); }); });
    rvBox.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { G.hov = true; sync(); } });
    rvBox.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') { G.hov = false; sync(); } });
    rvBox.addEventListener('focusin', function () { G.foc = true; sync(); });
    rvBox.addEventListener('focusout', function (e) { if (!rvBox.contains(e.relatedTarget)) { G.foc = false; sync(); } });
    var sx = 0, sy = 0, sw = false;
    stack.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse') return; sw = true; sx = e.clientX; sy = e.clientY; });
    stack.addEventListener('pointerup', function (e) {
      if (!sw) return; sw = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > 1.5 * Math.abs(dy)) manual(i + (dx < 0 ? 1 : -1));
    });
    stack.addEventListener('pointercancel', function () { sw = false; });
  })();

  /* ---- analyzer: a three-part rail fills as each field becomes usable; never blocks submit ---- */
  var card = $('.an-card');
  if (card) (function () {
    var tests = {
      'sbh-street': function (s) { return s.length >= 5 && /\d/.test(s) && /[a-z]{2}/i.test(s); },
      'sbh-city': function (s) { return s.length >= 2; },
      'sbh-zip': function (s) { return /^\d{5}(-?\d{4})?$/.test(s); }
    };
    function check() {
      var all = true;
      Object.keys(tests).forEach(function (id) {
        var el = document.getElementById(id), ok = !!el && tests[id](el.value.trim());
        var seg = $('.an-rail i[data-for="' + id + '"]', card);
        if (seg) seg.classList.toggle('ok', ok);
        if (!ok) all = false;
      });
      card.classList.toggle('is-ready', all);
    }
    card.addEventListener('input', check);
  })();

  /* ---- towns: each label lights its marker, and on desktop each marker lights its label ---- */
  var tw = $('#towns');
  if (tw) (function () {
    function pair(slug, on) {
      $$('[data-town="' + slug + '"]', tw).forEach(function (el) { el.classList.toggle('hl', on); });
    }
    $$('.tw-list a', tw).forEach(function (a) {
      var s = a.getAttribute('data-town');
      a.addEventListener('pointerenter', function () { pair(s, true); });
      a.addEventListener('pointerleave', function () { pair(s, false); });
      a.addEventListener('focus', function () { pair(s, true); });
      a.addEventListener('blur', function () { pair(s, false); });
    });
    var fine = window.matchMedia('(min-width:1100px) and (pointer:fine)');
    $$('.tw-marks .mk', tw).forEach(function (m) {
      var s = m.getAttribute('data-town'), a = $('.tw-list a[data-town="' + s + '"]', tw);
      m.addEventListener('pointerenter', function () { if (fine.matches) pair(s, true); });
      m.addEventListener('pointerleave', function () { if (fine.matches) pair(s, false); });
      m.addEventListener('click', function () { if (fine.matches && a) location.href = a.href; });
    });
  })();

  /* ---- motion preference can change while the page is open ---- */
  var onRm = function () {
    if (rm.matches) { html.classList.remove('m'); revealAll(); if (film.state === 'ready') { v.pause(); } }
    else if (hasIO) { html.classList.add('m'); }
    sync();
  };
  if (rm.addEventListener) rm.addEventListener('change', onRm); else if (rm.addListener) rm.addListener(onRm);

  /* the hero fills the first screen under the header; the header is 89px today */
  var hd = document.querySelector('body > header, header');
  if (hd && stage && hd.offsetHeight && hd.offsetHeight !== 89) stage.style.setProperty('--hdr', hd.offsetHeight + 'px');
})();
</script>
